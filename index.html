<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Slow Roads Clone - Procedural Driving</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #87ceeb; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        #canvas-container { width: 100%; height: 100%; position: absolute; left: 0; top: 0; }
        
        #hud { position: absolute; top: 20px; left: 20px; z-index: 10; color: white; pointer-events: none; }
        .speedometer { font-size: 42px; font-weight: 800; font-style: italic; text-shadow: 0 2px 10px rgba(0,0,0,0.3); }
        .unit { font-size: 16px; font-weight: normal; margin-left: 5px; opacity: 0.8; }
        
        #controls-hint { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.8); font-size: 14px; background: rgba(0,0,0,0.4); padding: 8px 16px; border-radius: 20px; backdrop-filter: blur(5px); pointer-events: none; }
        
        .touch-controls { position: absolute; bottom: 20px; width: 100%; display: flex; justify-content: space-between; padding: 0 20px; z-index: 10; pointer-events: none; }
        .control-group { display: flex; gap: 10px; pointer-events: auto; }
        .t-btn { width: 65px; height: 65px; background: rgba(255,255,255,0.25); border: 2px solid rgba(255,255,255,0.5); border-radius: 50%; display: flex; justify-content: center; align-items: center; color: white; font-weight: bold; font-size: 20px; backdrop-filter: blur(5px); touch-action: manipulation; }
        .t-btn:active { background: rgba(255,255,255,0.5); }
        
        @media (min-width: 768px) {
            .touch-controls { display: none; }
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="canvas-container"></div>
    
    <div id="hud">
        <div class="speedometer"><span id="speed">0</span><span class="unit">KM/H</span></div>
    </div>

    <div id="controls-hint">W, A, S, D veya Yön Tuşları ile Sürün</div>

    <div class="touch-controls">
        <div class="control-group">
            <div class="t-btn" id="btn-left">◄</div>
            <div class="t-btn" id="btn-right">►</div>
        </div>
        <div class="control-group">
            <div class="t-btn" id="btn-down">▼</div>
            <div class="t-btn" id="btn-up">▲</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
