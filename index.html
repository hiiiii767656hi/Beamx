<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Realistic 3D Sandbox</title>
    <link rel="stylesheet" href="style.css">
    <!-- Three.js Motoru -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="canvas-container"></div>
    
    <div id="ui-layer">
        <div id="hud">
            <h2 id="mode-text">Yaya Modu</h2>
            <div id="speed-display" style="display:none;">
                <span id="speed">0</span> <span class="unit">KM/H</span>
            </div>
        </div>
        
        <div id="interaction-prompt">Araca Binmek İçin 'F' veya Butona Bas</div>
        <button id="btn-action">BİN/İN</button>

        <div class="touch-controls">
            <div class="control-group">
                <button class="t-btn" id="btn-left">◄</button>
                <button class="t-btn" id="btn-right">►</button>
            </div>
            <div class="control-group">
                <button class="t-btn" id="btn-down">▼</button>
                <button class="t-btn" id="btn-up">▲</button>
            </div>
        </div>
    </div>

    <!-- Oyun Mantığı -->
    <script src="game.js"></script>
</body>
</html>
