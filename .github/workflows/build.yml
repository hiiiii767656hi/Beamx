name: apk
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip'i ac
        run: unzip -q beamx-source.zip
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: APK derle
        run: gradle -p beamx-source/android assembleRelease --no-daemon
      - name: APK adini duzelt
        run: cp beamx-source/android/app/build/outputs/apk/release/*.apk BeamX.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: BeamX v${{ github.run_number }}
          files: BeamX.apk
