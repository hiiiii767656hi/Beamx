name: BeamX Zip Extract & Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    # 1. İşletim Sistemi Değeri (En güncel ve kararlı Ubuntu sürümü)
    runs-on: ubuntu-22.04

    steps:
      # 2. Kodları Depodan Çek
      - name: Depoyu Çek
        uses: actions/checkout@v4

      # 3. Unzip Aracını Yükle ve ZIP Dosyasını Çıkar
      - name: Zip Dosyasını Aç
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          # ZIP dosyasını kök dizine çıkarır ve üzerine yazar
          unzip -o beamx-source.zip -d .
          # Çıkarılan dosyaların listesini logda gösterir
          ls -la

      # 4. Java Ortam Değerleri
      - name: Java 17 Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 5. Gradle Ortam Değerleri
      - name: Gradle Hazırla
        uses: gradle/actions/setup-gradle@v4

      # 6. Çalıştırma İzinlerini Düzenle
      - name: Çalıştırma İzinlerini Ver
        run: |
          chmod +x android/gradlew || true
          chmod +x ./build_windows.sh || true

      # 7. Derleme Adımı
      - name: APK Derle
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      # 8. Çıktıları Artifact Olarak Yükle
      - name: APK Dosyasını Yükle
        uses: actions/upload-artifact@v4
        with:
          name: BeamX-APK
          path: android/app/build/outputs/apk/release/*.apk