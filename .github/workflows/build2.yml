      - name: Zip Dosyasini Ac
        run: |
          # unzip paketinin yuklu oldugundan emin ol
          sudo apt-get update && sudo apt-get install -y unzip
          
          # Zip dosyasini hedef klasore cikar (Ornek: beamx-source.zip dosyasini iceriye cikarir)
          unzip -o beamx-source.zip -d .